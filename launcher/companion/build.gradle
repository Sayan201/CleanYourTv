plugins { id 'com.android.application' }

android {
    namespace 'com.sayan.cleanyourtv.companion'
    compileSdk 34
    defaultConfig { applicationId 'com.sayan.cleanyourtv.companion'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // The upstream Wireless Debug module bundles local AARs, which AGP cannot
    // inspect during the companion's release lint analysis. Keep CI compiling
    // and packaging the APK; run lint separately when that dependency is replaced.
    lint { checkReleaseBuilds false }
}
dependencies {
    implementation project(':wirelessdebug')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}