plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sayan.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sayan.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.1.1'
        buildConfigField "long", "BUILD_TIME", "${System.currentTimeMillis()}L"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def customKeystore = System.getenv('RELEASE_KEYSTORE') ?: System.getenv('ANDROID_KEYSTORE_PATH')
            if (customKeystore && file(customKeystore).exists()) {
                storeFile file(customKeystore)
                storePassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('ANDROID_KEY_PASSWORD')
            } else {
                storeFile file('../keystore/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, signed with repo keystore so it installs consistently across CI and devices.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
