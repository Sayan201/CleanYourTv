name: Publish Releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish CleanYourTv & SickTv APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure optional custom signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE_DATA="${ANDROID_KEYSTORE_BASE64:-$RELEASE_KEYSTORE_BASE64}"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$RELEASE_KEY_PASSWORD}"
          KEY_AL="${ANDROID_KEY_ALIAS:-$RELEASE_KEY_ALIAS}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-${RELEASE_KEY_PASSWORD:-$STORE_PASS}}"

          if [ -n "$KEYSTORE_DATA" ]; then
            echo "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/cleanyourtv-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cleanyourtv-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_AL" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/cleanyourtv-release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_AL" >> "$GITHUB_ENV"
            echo "Custom GitHub signing keystore configured successfully."
          else
            echo "No custom secrets provided, using deterministic repository keystore."
          fi

      - name: Build CleanYourTv launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Build SickTv companion APK
        working-directory: launcher/companion
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubRelease

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp launcher/app/build/outputs/apk/release/app-release.apk release-assets/launcher.apk
          cp launcher/companion/app/build/outputs/apk/github/release/app-github-release.apk release-assets/sicktv-companion.apk
          ls -la release-assets

      - name: Clean legacy release assets
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest app-release.apk -y || true
          gh release delete-asset latest cleanyourtv-launcher.apk -y || true
          gh release delete-asset latest cleanyourtv-standalone.apk -y || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('CleanYourTv & SickTv {0}', github.ref_name) || 'CleanYourTv & SickTv (Latest Build)' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: |
            release-assets/launcher.apk
            release-assets/sicktv-companion.apk
          body: |
            ## CleanYourTv & SickTv Companion

            Official signed Android APK packages for your Android TV and Android phone.

            ### Downloads (2 Apps)
            - **`launcher.apk`**: CleanYourTv Launcher for Android TV (`com.sayan.tvhome`).
            - **`sicktv-companion.apk`**: SickTv Companion app for Android phones (`app.sicktv`). Features wireless ADB TV connection, 1-click debloating with device-specific profiles, and seamless launcher setup.

            ---
            *Signed with project release key for persistent sideloading and verified updates.*
