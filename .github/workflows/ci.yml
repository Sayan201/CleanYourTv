name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher builds and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Wireless Debug library (Apache-2.0)
        uses: actions/checkout@v4
        with:
          repository: xswl369/android-wireless-debug
          ref: main
          path: wireless-debug-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release builds
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease \
            :standalone:testReleaseUnitTest :standalone:lintRelease :standalone:assembleRelease \
            :companion:assembleRelease
      - name: Original launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "original launcher APK: $((size / 1024)) KB"
          test "$size" -lt 5242880 || { echo "Original launcher APK is over 5 MiB; review launcher assets"; exit 1; }
      - name: Upload phone companion APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Phone-Companion-APK
          path: launcher/companion/build/outputs/apk/release/companion-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Standalone-APK
          path: launcher/standalone/build/outputs/apk/release/standalone-release.apk
          if-no-files-found: error
          retention-days: 14
